[project]
name = "hausalens"
version = "1.0.0"
description = "Reproducible Hausa social-media sentiment classification capstone"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8,<4",
  "playwright>=1.49,<2",
  "pytest>=8,<10",
  "seaborn>=0.13,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
